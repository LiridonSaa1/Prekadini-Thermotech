<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuAri Hausmeister - Admin Panel</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React 18, ReactDOM 18 and Babel Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase client support inside services -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

  <!-- Root mount element for React App -->
  <div id="root" class="flex-grow flex flex-col"></div>

  <!-- Database configs and API services -->
  <script src="supabase-config.js"></script>

  <!-- React code with Babel parsing -->
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    function App() {
      // Auth States
      const [isAuth, setIsAuth] = useState(false);
      const [passInput, setPassInput] = useState("");
      const [loginError, setLoginError] = useState(false);

      // Data States
      const [activeTab, setActiveTab] = useState("dashboard");
      const switchTab = (tab) => setActiveTab(tab);
      const [toast, setToast] = useState({ show: false, msg: "" });
      const [stats, setStats] = useState({ pendingInquiries: 0, unreadMessages: 0, pendingReviews: 0 });

      const [inquiries, setInquiries] = useState([]);
      const [messages, setMessages] = useState([]);
      const [services, setServices] = useState([]);
      const [projects, setProjects] = useState([]);
      const [vorteile, setVorteile] = useState([]);
      const [reviews, setReviews] = useState([]);
      const [settings, setSettings] = useState({});

      // Filters
      const [inquiryFilter, setInquiryFilter] = useState("all");
      const [reviewFilter, setReviewFilter] = useState("all");

      // Modals State
      const [emailModal, setEmailModal] = useState({ show: false, inquiry: null, subject: "", body: "", sending: false });
      const [serviceModal, setServiceModal] = useState({ show: false, service: null, title: "", price: "", photo: "", checklist: "", benefits: "" });
      const [projectModal, setProjectModal] = useState({ show: false, project: null, title: "", category: "", stats: "", beforePhoto: "", afterPhoto: "" });

      // Trigger Toast notification
      const showToast = useCallback((msg) => {
        setToast({ show: true, msg });
        setTimeout(() => setToast({ show: false, msg: "" }), 3000);
      }, []);

      // Fetch all sets of data from Supabase/LocalStorage
      const refreshData = async () => {
        try {
          const inqs = await InquiryService.fetchInquiries();
          const msgs = await ContactService.fetchMessages();
          const srvs = await ServiceManager.fetchServices();
          const projs = await ProjectService.fetchProjects();
          const vorts = await VorteileService.fetchVorteile();
          const revs = await ReviewService.fetchAllReviews();
          const sets = await SettingsService.fetchSettings();

          setInquiries(inqs);
          setMessages(msgs);
          setServices(srvs);
          setProjects(projs);
          setVorteile(vorts);
          setReviews(revs);
          setSettings(sets);

          setStats({
            pendingInquiries: inqs.filter(i => i.status === "Neu").length,
            unreadMessages: msgs.filter(m => !m.read).length,
            pendingReviews: revs.filter(r => !r.approved).length
          });
        } catch (err) {
          console.error("Data refresh failed:", err);
        }
      };

      // Check Session Auth on mount
      useEffect(() => {
        const isUserAuth = sessionStorage.getItem("admin_auth") === "true";
        if (isUserAuth) {
          setIsAuth(true);
          // Initial settings pre-fetch
          SettingsService.fetchSettings().then(sets => {
            setSettings(sets);
            refreshData();
          });
        } else {
          // pre-load settings so we can use password
          SettingsService.fetchSettings().then(sets => setSettings(sets));
        }
      }, []);

      // Handle Authentication Login
      const handleLogin = () => {
        const actualPass = settings.admin_password || "admin123";
        if (passInput === actualPass) {
          sessionStorage.setItem("admin_auth", "true");
          setLoginError(false);
          setIsAuth(true);
          refreshData();
        } else {
          setLoginError(true);
        }
      };

      const handleLogout = () => {
        sessionStorage.removeItem("admin_auth");
        setIsAuth(false);
      };

      // --- 1. Dashboard Tab Functions ---
      const isSupabaseConnected = typeof supabaseClient !== 'undefined' && supabaseClient !== null;

      // --- 2. Inquiries Tab Functions ---
      const handleInquiryStatusChange = async (id, newStatus) => {
        const ok = await InquiryService.updateStatus(id, newStatus);
        if (ok) {
          setInquiries(prev => prev.map(i => i.id === id ? { ...i, status: newStatus } : i));
          showToast("Status aktualisiert!");
          refreshData();
        }
      };

      const handleDeleteInquiry = async (id) => {
        if (confirm("Kërkesën me id " + id + " do ta fshini përgjithmonë?")) {
          const ok = await InquiryService.deleteInquiry(id);
          if (ok) {
            setInquiries(prev => prev.filter(i => i.id !== id));
            showToast("Kërkesa u fshi.");
            refreshData();
          }
        }
      };

      const openEmailDraft = (inq) => {
        const subject = `Ihr individuelles Angebot - DuAri Hausmeister`;
        const body = `Sehr geehrte/r ${inq.name},\n\nvielen Dank für Ihre Anfrage!\n\nGerne bieten wir Ihnen für die gewünschte Dienstleistung "${inq.service}" ein individuelles und faires Festpreisangebot an:\n\n---\nLEISTUNG: ${inq.service}\nFLÄCHE: ${inq.size} m²\nUMFANG: ${inq.rooms || 0} Zimmer, ${inq.bathrooms || 0} Bäder/Tualete, ${inq.windows || 0} Fenster\nADRESSE / ORT: ${inq.address}\nWUNSCHTERMIN: ${inq.date || "Nach Vereinbarung"}\n\nKONDITIONEN & ANGEBOTSPREIS:\nUnser kalkulierter Pauschalpreis beträgt: € ______________ (inkl. MwSt. & Anfahrt)\n\nInkludierte Arbeiten:\n${inq.message ? 'Spezifischer Wunsch: "' + inq.message + '"\n' : ''}- Gründliche Reinigung gemäß unserer Standard-Checkliste\n- Alle Reinigungsmittel & Profi-Ausrüstung inklusive\n- 100% Zufriedenheitsgarantie\n---\n\nBitte antworten Sie direkt auf diese E-Mail, um das Angebot zu bestätigen oder einen festen Termin zu vereinbaren.\n\nMit freundlichen Grüßen,\nDuAri Hausmeister\nTel: ${settings.phone || '+49 (0) 172 913 7112'}\nWhatsApp: https://wa.me/${settings.whatsapp || '491729137112'}`;
        
        setEmailModal({
          show: true,
          inquiry: inq,
          subject,
          body,
          sending: false
        });
      };

      const handleSendEmail = async () => {
        if (!emailModal.inquiry) return;
        setEmailModal(prev => ({ ...prev, sending: true }));
        try {
          const res = await InquiryService.sendBrevoOffer(
            emailModal.inquiry,
            emailModal.subject,
            emailModal.body,
            settings.brevo_api_key
          );
          
          await InquiryService.updateStatus(emailModal.inquiry.id, "Angebot erstellt");
          setEmailModal({ show: false, inquiry: null, subject: "", body: "", sending: false });
          
          if (res && res.mock) {
            alert("E-Mail-Vorschau erzeugt! (Demo-Modus aktiv - Details im Konsolen-Log).");
            console.log("Mock SMTP sent offer:\nSubject:", emailModal.subject, "\nBody:\n", emailModal.body);
          } else {
            showToast("Angebot erfolgreich gesendet!");
          }
          refreshData();
        } catch (e) {
          alert("Email sending failed: " + e.message);
          setEmailModal(prev => ({ ...prev, sending: false }));
        }
      };

      // --- 3. Messages Tab Functions ---
      const handleToggleMessageRead = async (id, currentRead) => {
        const ok = await ContactService.markAsRead(id, !currentRead);
        if (ok) {
          setMessages(prev => prev.map(m => m.id === id ? { ...m, read: !currentRead } : m));
          showToast(!currentRead ? "Nachricht gelesen." : "Nachricht ungelesen.");
          refreshData();
        }
      };

      const handleDeleteMessage = async (id) => {
        if (confirm("Möchten Sie diese Nachricht löschen?")) {
          const ok = await ContactService.deleteMessage(id);
          if (ok) {
            setMessages(prev => prev.filter(m => m.id !== id));
            showToast("Nachricht gelöscht.");
            refreshData();
          }
        }
      };

      // --- 4. Services Tab Functions ---
      const openServiceEdit = (srv = null) => {
        if (srv) {
          setServiceModal({
            show: true,
            service: srv,
            title: srv.title,
            price: srv.price,
            photo: srv.photo || "",
            checklist: (srv.checklist || []).join("\n"),
            benefits: (srv.benefits || []).join("\n")
          });
        } else {
          setServiceModal({
            show: true,
            service: null,
            title: "",
            price: "",
            photo: "",
            checklist: "",
            benefits: ""
          });
        }
      };

      const handleSaveService = async () => {
        const data = {
          title: serviceModal.title,
          price: serviceModal.price,
          photo: serviceModal.photo,
          checklist: serviceModal.checklist.split("\n").filter(x => x.trim()),
          benefits: serviceModal.benefits.split("\n").filter(x => x.trim())
        };
        if (serviceModal.service) {
          data.id = serviceModal.service.id;
        }

        const ok = await ServiceManager.saveService(data);
        if (ok) {
          setServiceModal(prev => ({ ...prev, show: false }));
          showToast("Dienstleistung gespeichert!");
          refreshData();
        }
      };

      const handleDeleteService = async (id) => {
        if (confirm("Möchten Sie diese Dienstleistung wirklich löschen?")) {
          const ok = await ServiceManager.deleteService(id);
          if (ok) {
            showToast("Dienstleistung gelöscht.");
            refreshData();
          }
        }
      };

      // --- 5. Gallery Tab Functions ---
      const openProjectEdit = (proj = null) => {
        if (proj) {
          setProjectModal({
            show: true,
            project: proj,
            title: proj.title,
            category: proj.category,
            stats: proj.stats,
            beforePhoto: proj.before_photo || "",
            afterPhoto: proj.after_photo || ""
          });
        } else {
          setProjectModal({
            show: true,
            project: null,
            title: "",
            category: "",
            stats: "",
            beforePhoto: "",
            afterPhoto: ""
          });
        }
      };

      const handleSaveProject = async () => {
        const data = {
          title: projectModal.title,
          category: projectModal.category,
          stats: projectModal.stats,
          before_photo: projectModal.beforePhoto,
          after_photo: projectModal.afterPhoto
        };
        if (projectModal.project) {
          data.id = projectModal.project.id;
        }

        const ok = await ProjectService.saveProject(data);
        if (ok) {
          setProjectModal(prev => ({ ...prev, show: false }));
          showToast("Projekt erfolgreich gespeichert!");
          refreshData();
        }
      };

      const handleDeleteProject = async (id) => {
        if (confirm("Möchten Sie dieses Projekt wirklich löschen?")) {
          const ok = await ProjectService.deleteProject(id);
          if (ok) {
            showToast("Projekt gelöscht.");
            refreshData();
          }
        }
      };

      // --- 6. Vorteile Tab Functions ---
      const handleVorteilChange = (index, field, value) => {
        setVorteile(prev => prev.map((vt, i) => i === index ? { ...vt, [field]: value } : vt));
      };

      const generateAIImage = async (index, prompt) => {
        if (!prompt || !prompt.trim()) {
          alert("Bitte geben Sie eine Beschreibung ein, um das KI-Bild zu generieren!");
          return;
        }

        // Temporarily flag card loading state in advantages list
        setVorteile(prev => prev.map((vt, i) => i === index ? { ...vt, loadingImage: true } : vt));
        
        try {
          const randomSeed = Math.floor(Math.random() * 1000000);
          const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=800&height=600&model=flux&nologo=true&seed=${randomSeed}`;
          
          const img = new Image();
          img.src = imageUrl;
          img.onload = () => {
            setVorteile(prev => prev.map((vt, i) => i === index ? { ...vt, photo: imageUrl, loadingImage: false } : vt));
            showToast("KI-Bild erfolgreich generiert!");
          };
        } catch (err) {
          console.error("AI image gen failed:", err);
          setVorteile(prev => prev.map((vt, i) => i === index ? { ...vt, loadingImage: false } : vt));
          alert("Konnte kein Bild generieren. Bitte nochmals versuchen.");
        }
      };

      const handleSaveAllVorteile = async () => {
        // Strip out temporary client variables like loadingImage
        const cleanVorteile = vorteile.map((vt, index) => ({
          id: vt.id,
          title: vt.title,
          description: vt.description,
          photo: vt.photo,
          sort_order: index + 1
        }));
        
        const ok = await VorteileService.saveVorteile(cleanVorteile);
        if (ok) {
          showToast("Vorteile erfolgreich gespeichert!");
          refreshData();
        }
      };

      // --- 7. Reviews Tab Functions ---
      const handleApproveReview = async (id) => {
        const ok = await ReviewService.approveReview(id);
        if (ok) {
          showToast("Vlerësimi u miratua!");
          refreshData();
        }
      };

      const handleRejectReview = async (id) => {
        const ok = await ReviewService.rejectReview(id);
        if (ok) {
          showToast("Vlerësimi u bllokua.");
          refreshData();
        }
      };

      const handleDeleteReview = async (id) => {
        if (confirm("Möchten Sie diese Bewertung wirklich löschen?")) {
          const ok = await ReviewService.deleteReview(id);
          if (ok) {
            showToast("Bewertung gelöscht.");
            refreshData();
          }
        }
      };

      // --- 8. Settings Tab Functions ---
      const handleSettingChange = (field, val) => {
        setSettings(prev => ({ ...prev, [field]: val }));
      };

      const handleSaveSettings = async () => {
        const updated = await SettingsService.saveSettings(settings);
        if (updated) {
          setSettings(updated);
          showToast("Einstellungen erfolgreich gespeichert!");
          refreshData();
        }
      };

      // Tab Filtering Memoizations
      const filteredInquiries = useMemo(() => {
        if (inquiryFilter === "all") return inquiries;
        return inquiries.filter(i => i.status === inquiryFilter);
      }, [inquiries, inquiryFilter]);

      const filteredReviews = useMemo(() => {
        if (reviewFilter === "all") return reviews;
        if (reviewFilter === "pending") return reviews.filter(r => !r.approved);
        return reviews.filter(r => r.approved);
      }, [reviews, reviewFilter]);

      if (!isAuth) {
        return (
          <div id="login-container" class="flex flex-col items-center justify-center min-h-screen px-4">
            <div class="bg-white rounded-3xl p-8 shadow-xl max-w-md w-full border border-slate-200/50">
              <div class="flex flex-col items-center mb-8">
                <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center font-black text-2xl shadow-lg shadow-blue-500/20 mb-4">DA</div>
                <h2 class="text-xl font-bold text-slate-900 text-center">DuAri Hausmeister</h2>
                <p class="text-xs text-slate-400 mt-1">Admin Dashboard Login</p>
              </div>
              
              <div class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Passwort</label>
                  <input 
                    type="password" 
                    placeholder="Passwort eingeben" 
                    value={passInput} 
                    onChange={(e) => setPassInput(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && handleLogin()}
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-600 font-semibold transition-all"
                  />
                </div>
                {loginError && <div class="text-red-500 text-xs font-semibold">Falsches Passwort! Bitte versuchen Sie es erneut.</div>}
                <button onclick={handleLogin} class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition-all shadow-md mt-2 focus:outline-none">
                  Einloggen
                </button>
              </div>
              <div class="mt-6 text-center text-[10px] text-slate-400">
                Standard-Passwort: <span class="font-bold">admin123</span>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div id="dashboard-container" class="flex-grow flex flex-col md:flex-row">
          
          {/* TOAST PANEL */}
          <div class={`fixed top-4 right-4 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-2 transition-all duration-300 transform ${toast.show ? 'translate-x-0 opacity-100' : 'translate-x-full opacity-0'}`}>
            <span class="text-xs font-semibold">{toast.msg}</span>
          </div>

          {/* SIDEBAR NAVIGATION */}
          <aside class="w-full md:w-64 bg-slate-900 text-slate-400 flex flex-col border-r border-slate-800 shrink-0">
            <div class="p-6 flex items-center space-x-3 border-b border-slate-800">
              <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-black text-lg">DA</div>
              <div>
                <span class="text-sm font-bold text-white block">DuAri Service</span>
                <span class="text-[10px] text-slate-500 block">
                  {isSupabaseConnected ? "Supabase Connected" : "LocalStorage Mode"}
                </span>
              </div>
            </div>
            
            <nav class="flex-grow p-4 space-y-1 text-xs font-bold select-none overflow-y-auto">
              <button onClick={() => switchTab("dashboard")} class={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${activeTab === "dashboard" ? "text-white bg-blue-600" : "hover:text-white hover:bg-slate-800"}`}>
                <span>📊 Dashboard</span>
              </button>
              <button onClick={() => switchTab("inquiries")} class={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${activeTab === "inquiries" ? "text-white bg-blue-600" : "hover:text-white hover:bg-slate-800"}`}>
                <span>📬 Angebote & Anfragen</span>
              </button>
              <button onClick={() => switchTab("messages")} class={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${activeTab === "messages" ? "text-white bg-blue-600" : "hover:text-white hover:bg-slate-800"}`}>
                <span>✉️ Kontakt-Nachrichten</span>
              </button>
              <button onClick={() => switchTab("services")} class={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${activeTab === "services" ? "text-white bg-blue-600" : "hover:text-white hover:bg-slate-800"}`}>
                <span>🌟 Dienstleistungen</span>
              </button>
              <button onClick={() => switchTab("gallery")} class={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${activeTab === "gallery" ? "text-white bg-blue-600" : "hover:text-white hover:bg-slate-800"}`}>
                <span>🖼️ Galerie (Vorher/Nachher)</span>
              </button>
              <button onClick={() => switchTab("vorteile")} class={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${activeTab === "vorteile" ? "text-white bg-blue-600" : "hover:text-white hover:bg-slate-800"}`}>
                <span>🎨 Vorteile & About</span>
              </button>
              <button onClick={() => switchTab("reviews")} class={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${activeTab === "reviews" ? "text-white bg-blue-600" : "hover:text-white hover:bg-slate-800"}`}>
                <span>⭐ Bewertungen & Sterne</span>
              </button>
              <button onClick={() => switchTab("settings")} class={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${activeTab === "settings" ? "text-white bg-blue-600" : "hover:text-white hover:bg-slate-800"}`}>
                <span>⚙️ Website-Einstellungen</span>
              </button>
            </nav>
            <div class="p-4 border-t border-slate-800 text-xs">
              <button onClick={handleLogout} class="w-full bg-slate-800 hover:bg-red-950 hover:text-red-300 text-slate-400 py-2.5 rounded-xl font-bold transition-all">
                Abmelden
              </button>
            </div>
          </aside>

          {/* MAIN PAGE RENDER */}
          <main class="flex-grow overflow-y-auto p-6 md:p-8">
            
            {/* 1. DASHBOARD PANEL */}
            {activeTab === "dashboard" && (
              <div class="space-y-6">
                <div>
                  <h1 class="text-2xl font-extrabold text-slate-900">Willkommen im Admin Panel</h1>
                  <p class="text-sm text-slate-500 mt-1">Hier ist die schnelle Übersicht über Ihr Geschäft.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div class="bg-white rounded-3xl p-6 border border-slate-200/60 shadow-sm flex items-center space-x-4">
                    <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-xl">📬</div>
                    <div>
                      <span class="text-slate-400 font-bold text-[10px] uppercase tracking-wider block">Unbearbeitete Anfragen</span>
                      <span class="text-3xl font-extrabold text-slate-900 block mt-1">{stats.pendingInquiries}</span>
                    </div>
                  </div>
                  <div class="bg-white rounded-3xl p-6 border border-slate-200/60 shadow-sm flex items-center space-x-4">
                    <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center text-xl">✉️</div>
                    <div>
                      <span class="text-slate-400 font-bold text-[10px] uppercase tracking-wider block">Ungelesene Nachrichten</span>
                      <span class="text-3xl font-extrabold text-slate-900 block mt-1">{stats.unreadMessages}</span>
                    </div>
                  </div>
                  <div class="bg-white rounded-3xl p-6 border border-slate-200/60 shadow-sm flex items-center space-x-4">
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-xl">⭐</div>
                    <div>
                      <span class="text-slate-400 font-bold text-[10px] uppercase tracking-wider block">Ausstehende Bewertungen</span>
                      <span class="text-3xl font-extrabold text-slate-900 block mt-1">{stats.pendingReviews}</span>
                    </div>
                  </div>
                </div>

                <div class="bg-white rounded-3xl p-6 md:p-8 border border-slate-200/60 shadow-sm space-y-4">
                  <h2 class="text-lg font-bold text-slate-900">Supabase & Brevo Integration</h2>
                  <p class="text-xs text-slate-500 leading-relaxed">
                    Dieses Admin Panel läuft auf einer dynamischen React-Engine und kommuniziert direkt mit Ihren APIs. Wenn Supabase nicht angebunden ist, greift das Panel voll-automatisch auf Browser-LocalStorage zurück.
                  </p>
                  <div class="bg-slate-50 border border-slate-200/50 rounded-2xl p-4 text-[11px] font-mono leading-relaxed space-y-1">
                    <div>
                      <span class="font-bold text-slate-400 font-bold mr-2">Brevo SMTP Engine:</span> 
                      <span class={settings.brevo_api_key ? "text-emerald-600 font-bold" : "text-amber-600 font-bold"}>

                                Sperren
                              </button>
                            )}
                            <button onClick={() => handleDeleteReview(review.id)} class="flex-1 md:w-32 bg-red-50 text-red-600 hover:bg-red-100 text-xs font-bold py-2.5 px-4 rounded-xl transition-all border border-red-200/30">
                              Löschen
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* 8. WEBSITE EINSTELLUNGEN PANEL */}
            {activeTab === "settings" && (
              <div class="space-y-6">
                <div>
                  <h1 class="text-2xl font-extrabold text-slate-900">Website Einstellungen</h1>
                  <p class="text-sm text-slate-500 mt-1">Ändern Sie Kontaktangaben, Passwörter und E-Mail-Schlüssel.</p>
                </div>

                <div class="bg-white rounded-3xl p-6 md:p-8 border border-slate-200/60 shadow-md space-y-6">
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs font-bold">
                    <div>
                      <label class="block text-slate-500 uppercase tracking-wider mb-2">Telefonnummer</label>
                      <input 
                        type="text" 
                        value={settings.phone || ""}
                        onChange={(e) => handleSettingChange("phone", e.target.value)}
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold focus:outline-none focus:border-blue-600 transition-all"
                      />
                    </div>
                    <div>
                      <label class="block text-slate-500 uppercase tracking-wider mb-2">E-Mail-Adresse</label>
                      <input 
                        type="email" 
                        value={settings.email || ""}
                        onChange={(e) => handleSettingChange("email", e.target.value)}
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold focus:outline-none focus:border-blue-600 transition-all"
                      />
                    </div>
                    <div>
                      <label class="block text-slate-500 uppercase tracking-wider mb-2">Adresse</label>
                      <input 
                        type="text" 
                        value={settings.address || ""}
                        onChange={(e) => handleSettingChange("address", e.target.value)}
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold focus:outline-none focus:border-blue-600 transition-all"
                      />
                    </div>
                    <div>
                      <label class="block text-slate-500 uppercase tracking-wider mb-2">Arbeitszeiten</label>
                      <input 
                        type="text" 
                        value={settings.working_hours || ""}
                        onChange={(e) => handleSettingChange("working_hours", e.target.value)}
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold focus:outline-none focus:border-blue-600 transition-all"
                      />
                    </div>
                    <div>
                      <label class="block text-slate-500 uppercase tracking-wider mb-2">WhatsApp Nummer (Nur Zahlen, z.B. 491729137112)</label>
                      <input 
                        type="text" 
                        value={settings.whatsapp || ""}
                        onChange={(e) => handleSettingChange("whatsapp", e.target.value)}
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold focus:outline-none focus:border-blue-600 transition-all"
                      />
                    </div>
                    <div>
                      <label class="block text-slate-500 uppercase tracking-wider mb-2">Brevo API-Schlüssel (api-key)</label>
                      <input 
                        type="password" 
                        placeholder="xkeysib-..." 
                        value={settings.brevo_api_key || ""}
                        onChange={(e) => handleSettingChange("brevo_api_key", e.target.value)}
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold focus:outline-none focus:border-blue-600 transition-all"
                      />
                    </div>
                  </div>

                  <div class="border-t border-slate-100 pt-6">
                    <h3 class="text-sm font-bold text-slate-900 mb-4">Admin-Passwort ändern</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs font-bold">
                      <div>
                        <label class="block text-slate-500 uppercase tracking-wider mb-2">Neues Passwort</label>
                        <input 
                          type="password" 
                          placeholder="Neues Passwort (min. 6 Zeichen)" 
                          onChange={(e) => handleSettingChange("admin_password", e.target.value)}
                          class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-semibold focus:outline-none focus:border-blue-600 transition-all"
                        />
                      </div>
                    </div>
                  </div>

                  <div class="flex justify-end pt-4">
                    <button onClick={handleSaveSettings} class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-3 px-6 rounded-xl transition-all shadow-md">
                      Einstellungen speichern
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* ================= MODALS ================= */}

          {/* 1. Brevo Email Send Modal */}
          {emailModal.show && emailModal.inquiry && (
            <div class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-white rounded-3xl max-w-2xl w-full p-6 md:p-8 shadow-2xl border border-slate-100 flex flex-col space-y-4">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 class="text-lg font-bold text-slate-900 flex items-center space-x-2">
                    <span>📧</span>
                    <span>Angebot per Brevo senden</span>
                  </h3>
                  <button onClick={() => setEmailModal({ show: false, inquiry: null, subject: "", body: "", sending: false })} class="text-slate-400 hover:text-slate-600 text-xl font-bold focus:outline-none">&times;</button>
                </div>
                
                <div class="space-y-4 text-xs font-semibold">
                  <div>
                    <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Empfänger E-Mail</label>
                    <input type="text" disabled value={`${emailModal.inquiry.name} <${emailModal.inquiry.email}>`} class="w-full bg-slate-100 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-500 focus:outline-none" />
                  </div>
                  <div>
                    <label class="block text-slate-500 uppercase tracking-wider mb-1.5">E-Mail Betreff (Subject)</label>
                    <input 
                      type="text" 
                      value={emailModal.subject} 
                      onChange={(e) => setEmailModal(prev => ({ ...prev, subject: e.target.value }))}
                      class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600 transition-all"
                    />
                  </div>
                  <div>
                    <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Nachricht (E-Mail Text)</label>
                    <textarea 
                      rows="10" 
                      value={emailModal.body}
                      onChange={(e) => setEmailModal(prev => ({ ...prev, body: e.target.value }))}
                      class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600 transition-all font-mono resize-none"
                    />
                  </div>
                </div>

                <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                  <span class="text-[10px] text-slate-400 font-bold">Sender: DuAri Hausmeister &lt;duariservice@gmail.com&gt;</span>
                  <div class="flex items-center space-x-2">
                    <button onClick={() => setEmailModal({ show: false, inquiry: null, subject: "", body: "", sending: false })} class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-xs transition-all">Abbrechen</button>
                    <button onClick={handleSendEmail} disabled={emailModal.sending} class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs transition-all flex items-center space-x-1.5 disabled:opacity-50">
                      <span>{emailModal.sending ? "Wird gesendet..." : "Angebot senden"}</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 2. Add/Edit Service Modal */}
          {serviceModal.show && (
            <div class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-white rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl border border-slate-100 flex flex-col space-y-4">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 class="text-lg font-bold text-slate-900">
                    {serviceModal.service ? "Leistung bearbeiten" : "Neue Leistung hinzufügen"}
                  </h3>
                  <button onClick={() => setServiceModal(prev => ({ ...prev, show: false }))} class="text-slate-400 hover:text-slate-600 text-xl font-bold focus:outline-none">&times;</button>
                </div>
                
                <div class="space-y-4 text-xs font-semibold overflow-y-auto max-h-[400px] pr-2">
                  <div>
                    <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Titel der Dienstleistung</label>
                    <input 
                      type="text" 
                      value={serviceModal.title} 
                      onChange={(e) => setServiceModal(prev => ({ ...prev, title: e.target.value }))}
                      placeholder="z.B. Büroreinigung" 
                      class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600"
                    />
                  </div>
                  <div>
                    <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Preis ab (ab €)</label>
                    <input 
                      type="text" 
                      value={serviceModal.price} 
                      onChange={(e) => setServiceModal(prev => ({ ...prev, price: e.target.value }))}
                      placeholder="z.B. 30" 
                      class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600"
                    />
                  </div>
                  <div>
                    <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Foto (URL / File)</label>
                    <input 
                      type="text" 
                      value={serviceModal.photo} 
                      onChange={(e) => setServiceModal(prev => ({ ...prev, photo: e.target.value }))}
                      placeholder="brandschutz.jpg" 
                      class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600"
                    />
                  </div>
                  <div>
                    <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Checklist (Eine Zeile pro Punkt)</label>
                    <textarea 
                      rows="4" 
                      value={serviceModal.checklist} 
                      onChange={(e) => setServiceModal(prev => ({ ...prev, checklist: e.target.value }))}
                      placeholder="Punkt 1&#10;Punkt 2" 
                      class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600 resize-none"
                    />
                  </div>
                  <div>
                    <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Vorteile (Eine Zeile pro Punkt)</label>
                    <textarea 
                      rows="4" 
                      value={serviceModal.benefits} 
                      onChange={(e) => setServiceModal(prev => ({ ...prev, benefits: e.target.value }))}
                      placeholder="Vorteil 1&#10;Vorteil 2" 
                      class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600 resize-none"
                    />
                  </div>
                </div>

                <div class="flex justify-end space-x-2 pt-4 border-t border-slate-100">
                  <button onClick={() => setServiceModal(prev => ({ ...prev, show: false }))} class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-xs transition-all">Abbrechen</button>
                  <button onClick={handleSaveService} class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs transition-all">Speichern</button>
                </div>
              </div>
            </div>
          )}

          {/* 3. Add/Edit Project Modal */}
          {projectModal.show && (
            <div class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-white rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl border border-slate-100 flex flex-col space-y-4">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 class="text-lg font-bold text-slate-900">
                    {projectModal.project ? "Projekt bearbeiten" : "Neues Projekt hinzufügen"}
                  </h3>
                  <button onClick={() => setProjectModal(prev => ({ ...prev, show: false }))} class="text-slate-400 hover:text-slate-600 text-xl font-bold focus:outline-none">&times;</button>
                </div>

                <div class="space-y-4 text-xs font-semibold overflow-y-auto max-h-[400px] pr-2">
                  <div>
                    <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Projekttitel</label>
                    <input 
                      type="text" 
                      value={projectModal.title} 
                      onChange={(e) => setProjectModal(prev => ({ ...prev, title: e.target.value }))}
                      placeholder="z.B. Büroreinigung Hauptbahnhof" 
                      class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600"
                    />
                  </div>
                  <div>
                    <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Kategorie / Genre</label>
                    <input 
                      type="text" 
                      value={projectModal.category} 
                      onChange={(e) => setProjectModal(prev => ({ ...prev, category: e.target.value }))}
                      placeholder="z.B. Büroreinigung" 
                      class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600"
                    />
                  </div>
                  <div>
                    <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Statistik (z.B. 100% pastërti)</label>
                    <input 
                      type="text" 
                      value={projectModal.stats} 
                      onChange={(e) => setProjectModal(prev => ({ ...prev, stats: e.target.value }))}
                      placeholder="100% pastërti" 
                      class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600"
                    />
                  </div>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Foto Vorher (URL/Filename)</label>
                      <input 
                        type="text" 
                        value={projectModal.beforePhoto} 
                        onChange={(e) => setProjectModal(prev => ({ ...prev, beforePhoto: e.target.value }))}
                        placeholder="kaelteschutz.jpg" 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600"
                      />
                    </div>
                    <div>
                      <label class="block text-slate-500 uppercase tracking-wider mb-1.5">Foto Nachher (URL/Filename)</label>
                      <input 
                        type="text" 
                        value={projectModal.afterPhoto} 
                        onChange={(e) => setProjectModal(prev => ({ ...prev, afterPhoto: e.target.value }))}
                        placeholder="schallschutz.jpg" 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-blue-600"
                      />
                    </div>
                  </div>
                </div>

                <div class="flex justify-end space-x-2 pt-4 border-t border-slate-100">
                  <button onClick={() => setProjectModal(prev => ({ ...prev, show: false }))} class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-xs transition-all">Abbrechen</button>
                  <button onClick={handleSaveProject} class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs transition-all">Speichern</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
